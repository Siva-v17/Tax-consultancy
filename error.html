<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Stackly Tax Consultants</title>
<meta name="description" content="The page you are looking for could not be found. Go back or return to the Stackly Tax Consultants home page.">
<link rel="icon" href="./stackly.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
    /* ==========================================================
       Stackly Tax - 404.html styles
       class prefix: stackly-404-
       ========================================================== */

    :root{
        --bg:#070b16;
        --card:#0f1627;
        --line:#222c45;
        --gold:#e6b450;
        --gold2:#ffd98a;
        --txt:#e8ecf6;
        --mut:#94a0bd;
        --r:18px;
    }

    /* ---------- BASE ---------- */

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    html{
        scroll-behavior:smooth;
    }

    body{
        font-family:'Inter',sans-serif;
        background:var(--bg);
        color:var(--txt);
        line-height:1.65;
        overflow-x:hidden;
    }

    h1,
    h2,
    h3,
    h4{
        font-family:'Playfair Display',serif;
        line-height:1.15;
    }

    img{
        max-width:100%;
        display:block;
    }

    a{
        color:inherit;
        text-decoration:none;
    }

    #loader.stackly-404-is-done{
        transform:translateY(-100%);
    }

    /* ---------- BACKGROUND ---------- */

    .stackly-404-bg{
        position:fixed;
        inset:0;
        z-index:-1;
        overflow:hidden;
        background:radial-gradient(circle at 20% 10%,#101a36,#070b16 60%);
    }

    .stackly-404-blob{
        position:absolute;
        border-radius:50%;
        filter:blur(90px);
        opacity:.5;
    }

    .stackly-404-blob-1{
        width:480px;
        height:480px;
        background:#e6b450;
        top:-120px;
        left:-100px;
        opacity:.28;
    }

    .stackly-404-blob-2{
        width:560px;
        height:560px;
        background:#2f4cdd;
        right:-160px;
        top:30%;
        opacity:.3;
    }

    .stackly-404-blob-3{
        width:420px;
        height:420px;
        background:#14b8a6;
        left:30%;
        bottom:-160px;
        opacity:.2;
    }

    .stackly-404-grid{
        position:absolute;
        inset:-50%;
        background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);
        background-size:60px 60px;
        transform:perspective(700px) rotateX(55deg);
        mask-image:radial-gradient(circle,#000 20%,transparent 70%);
    }

    .stackly-404-ring{
        position:absolute;
        width:520px;
        height:520px;
        border:1px dashed #e6b45055;
        border-radius:50%;
        right:8%;
        top:12%;
    }

    /* ---------- LAYOUT & TYPOGRAPHY ---------- */

    .stackly-404-wrap{
        width:min(1200px,92%);
        margin:auto;
    }

    section{
        padding:100px 0;
        position:relative;
    }

    .stackly-404-word{
        display:inline-block;
        overflow:hidden;
        vertical-align:bottom;
    }

    .stackly-404-char{
        display:inline-block;
    }

    .stackly-404-eyebrow{
        color:var(--gold);
        letter-spacing:.2em;
        text-transform:uppercase;
        font-size:.8rem;
        margin-bottom:12px;
        display:block;
    }

    /* ---------- HEADER ---------- */

    header{
        position:fixed;
        top:0;
        width:100%;
        z-index:50;
        backdrop-filter:blur(14px);
        background:#070b16cc;
        border-bottom:1px solid var(--line);
    }

    .stackly-404-header-inner{
        display:flex;
        align-items:center;
        justify-content:space-between;
        height:84px;
    }

    .stackly-404-logo img{
        height:70px;
        width:auto;
    }

    nav ul{
        display:flex;
        gap:28px;
        list-style:none;
        align-items:center;
    }

    nav a{
        font-size:.95rem;
        color:var(--mut);
        transition:.3s;
    }

    nav a:hover{
        color:var(--gold);
    }

    .stackly-404-burger{
        display:none;
        background:none;
        border:0;
        color:var(--txt);
        font-size:2rem;
        cursor:pointer;
    }

    .stackly-404-burger{
        transition:color .3s,transform .4s;
    }

    .stackly-404-burger.stackly-404-is-open{
        color:var(--gold);
        transform:rotate(180deg);
    }

    /* ---------- BUTTONS ---------- */

    .stackly-404-btn{
        display:inline-block;
        padding:14px 30px;
        border-radius:50px;
        background:linear-gradient(135deg,var(--gold),var(--gold2));
        color:#111;
        font-weight:600;
        border:0;
        cursor:pointer;
        transition:box-shadow .3s;
    }

    .stackly-404-btn:hover{
        box-shadow:0 10px 40px #e6b45066;
    }

    .stackly-404-btn.stackly-404-btn-outline{
        background:none;
        border:1px solid var(--gold);
        color:var(--gold);
    }

    /* ---------- HERO ---------- */

    .stackly-404-hero{
        min-height:100vh;
        display:flex;
        align-items:center;
        padding-top:130px;
    }

    .stackly-404-hero h1{
        font-size:clamp(2.4rem,6vw,5rem);
        margin-bottom:22px;
    }

    .stackly-404-hero h1 em{
        color:var(--gold);
        font-style:normal;
    }

    .stackly-404-hero p{
        max-width:560px;
        color:var(--mut);
        margin-bottom:30px;
    }

    /* ---------- FORMS ---------- */

    form{
        display:grid;
        gap:16px;
    }

    input,
    select,
    textarea{
        width:100%;
        padding:15px 18px;
        background:#0b1121;
        border:1px solid var(--line);
        border-radius:12px;
        color:var(--txt);
        font:inherit;
    }

    input:focus,
    select:focus,
    textarea:focus{
        outline:0;
        border-color:var(--gold);
    }

    /* ---------- TABLES ---------- */

    table{
        width:100%;
        border-collapse:collapse;
    }

    th,
    td{
        text-align:left;
        padding:13px 10px;
        border-bottom:1px solid var(--line);
        font-size:.92rem;
    }

    th{
        color:var(--gold);
    }

    /* ---------- FOOTER ---------- */

    footer{
        border-top:1px solid var(--line);
        padding:70px 0 30px;
        background:#050813;
    }

    footer{
        padding:70px 0 0;
        background:radial-gradient(circle at 85% 0,#101a36,#050813 60%);
        border-top:1px solid var(--line);
    }

    .stackly-404-foot-top{
        display:grid;
        grid-template-columns:1.4fr 1fr 1fr 1fr 1.4fr;
        gap:40px;
    }

    .stackly-404-foot-brand p{
        color:var(--mut);
        font-size:.92rem;
        margin:14px 0;
    }

    .stackly-404-foot-socials{
        display:flex;
        gap:10px;
    }

    .stackly-404-foot-socials a{
        width:36px;
        height:36px;
        border:1px solid var(--line);
        border-radius:50%;
        display:grid;
        place-items:center;
        color:var(--gold);
        background:#0b1121;
        transition:.3s;
    }

    .stackly-404-foot-socials a:hover{
        background:var(--gold);
        color:#111;
        transform:translateY(-3px);
    }

    footer h4{
        font-family:'Inter',sans-serif;
        color:var(--gold);
        font-size:.82rem;
        letter-spacing:.16em;
        text-transform:uppercase;
        margin-bottom:20px;
    }

    .stackly-404-foot-links a{
        display:block;
        color:var(--mut);
        font-size:.92rem;
        margin:13px 0;
        transition:.3s;
    }

    .stackly-404-foot-links a::before{
        content:"\203A";
        color:var(--gold);
        margin-right:12px;
    }

    .stackly-404-foot-links a:hover{
        color:var(--gold);
        transform:translateX(5px);
    }

    .stackly-404-foot-contact p{
        display:flex;
        gap:12px;
        align-items:center;
        color:var(--mut);
        font-size:.92rem;
        margin:13px 0;
    }

    .stackly-404-foot-contact p span{
        color:var(--gold);
    }

    .stackly-404-foot-cta{
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:14px;
        border:1px solid var(--line);
        background:#0d1426;
        border-radius:12px;
        padding:18px;
        margin-top:22px;
        transition:.3s;
    }

    .stackly-404-foot-cta:hover{
        border-color:var(--gold);
    }

    .stackly-404-foot-cta b{
        display:block;
        font-size:.95rem;
    }

    .stackly-404-foot-cta small{
        color:var(--mut);
        font-size:.78rem;
        display:block;
        margin-top:4px;
    }

    .stackly-404-foot-cta>span{
        color:var(--gold);
        font-size:1.4rem;
    }

    .stackly-404-foot-mid{
        display:grid;
        grid-template-columns:1.1fr 2.4fr 1.5fr;
        gap:30px;
        align-items:center;
        border-top:1px solid var(--line);
        margin-top:50px;
        padding:34px 0;
    }

    footer small{
        color:var(--mut);
        font-size:.8rem;
    }

    .stackly-404-foot-trust{
        display:flex;
        gap:14px;
        align-items:center;
    }

    .stackly-404-foot-trust b{
        display:block;
    }

    .stackly-404-foot-shield{
        font-size:1.8rem;
        border:1px solid var(--gold);
        border-radius:12px;
        padding:6px 10px;
    }

    .stackly-404-foot-stats{
        display:grid;
        grid-template-columns:repeat(4,1fr);
        text-align:center;
    }

    .stackly-404-foot-stats div{
        border-left:1px solid var(--line);
        padding:0 8px;
    }

    .stackly-404-foot-stats b{
        display:block;
        font-size:1.05rem;
    }

    .stackly-404-foot-stats small{
        display:block;
    }

    .stackly-404-foot-news form{
        display:flex;
        margin-top:12px;
    }

    .stackly-404-foot-news input{
        border-radius:8px 0 0 8px;
        min-width:0;
        padding:12px 14px;
    }

    .stackly-404-foot-news .stackly-404-btn{
        border-radius:0 8px 8px 0;
        padding:0 20px;
        white-space:nowrap;
    }

    .stackly-404-foot-bottom{
        display:flex;
        justify-content:space-between;
        flex-wrap:wrap;
        gap:14px;
        border-top:1px solid var(--line);
        padding:22px 0;
        font-size:.85rem;
        color:var(--mut);
    }

    .stackly-404-foot-pay em{
        font-style:normal;
        font-weight:700;
        font-size:.72rem;
        color:#fff;
        background:#10182c;
        border:1px solid var(--line);
        padding:4px 10px;
        border-radius:6px;
        margin-left:8px;
    }

    /* ---------- LOADER ---------- */

    #loader{
        position:fixed;
        inset:0;
        z-index:999;
        background:#050813;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
        gap:26px;
        transition:transform .9s cubic-bezier(.77,0,.18,1);
        animation:stackly-404-loader-out .5s 7s forwards;
    }

    .stackly-404-loader-logo img{
        height:90px;
        width:auto;
        animation:stackly-404-pulse 1.4s ease-in-out infinite;
    }

    .stackly-404-loader-bar{
        width:min(260px,70vw);
        height:3px;
        background:#222c45;
        border-radius:3px;
        overflow:hidden;
    }

    .stackly-404-loader-bar i{
        display:block;
        height:100%;
        width:0;
        background:linear-gradient(90deg,var(--gold),var(--gold2));
    }

    .stackly-404-loader-num{
        font-family:'Playfair Display',serif;
        color:var(--gold);
        font-size:1.4rem;
    }

    @keyframes stackly-404-pulse{
        50%{
            transform:scale(1.08);
            opacity:.7;
        }
    }

    @keyframes stackly-404-loader-out{
        to{
            opacity:0;
            visibility:hidden;
        }
    }

    /* ---------- NOT FOUND ---------- */

    .stackly-404-err-wrap{
        text-align:center;
    }

    .stackly-404-hero .stackly-404-err-code{
        font-family:'Playfair Display',serif;
        font-size:clamp(6rem,22vw,14rem);
        line-height:1;
        font-weight:700;
        background:linear-gradient(135deg,var(--gold),var(--gold2));
        -webkit-background-clip:text;
        background-clip:text;
        color:transparent;
        max-width:none;
        width:100%;
        margin:0 auto 10px;
        text-align:center;
    }

    .stackly-404-err-wrap h1{
        margin-bottom:18px;
    }

    .stackly-404-hero .stackly-404-err-text{
        max-width:520px;
        margin:0 auto 34px;
        color:var(--mut);
    }

    .stackly-404-err-actions{
        display:flex;
        justify-content:center;
        flex-wrap:wrap;
        gap:16px;
    }

    @media (max-width:480px){
        .stackly-404-err-actions{
            flex-direction:column;
        }
    }

    /* ---------- RESPONSIVE ---------- */

    @media (max-width:768px){
        .stackly-404-burger{
            display:block;
        }

        nav{
            position:absolute;
            top:84px;
            left:0;
            width:100%;
            background:#070b16f5;
            max-height:0;
            overflow:hidden;
            transition:max-height .4s;
        }

        nav.stackly-404-is-open{
            max-height:480px;
            border-bottom:1px solid var(--line);
        }

        nav ul{
            flex-direction:column;
            padding:20px;
            gap:16px;
        }

        section{
            padding:70px 0;
        }

        .stackly-404-ring{
            display:none;
        }
    }

    @media (max-width:480px){
        .stackly-404-logo img{
            height:56px;
        }

        .stackly-404-hero h1{
            font-size:2.3rem;
        }

        .stackly-404-btn{
            width:100%;
            text-align:center;
        }
    }

    @media (max-width:1100px){
        .stackly-404-foot-top{
            grid-template-columns:repeat(3,1fr);
        }

        .stackly-404-foot-mid{
            grid-template-columns:1fr;
        }

        .stackly-404-foot-stats div:first-child{
            border-left:0;
        }
    }

    @media (max-width:768px){
        footer{
            padding-top:50px;
        }

        .stackly-404-foot-top{
            grid-template-columns:1fr 1fr;
            gap:30px;
        }

        .stackly-404-foot-brand,
        .stackly-404-foot-contact{
            grid-column:1/-1;
        }
    }

    @media (max-width:480px){
        .stackly-404-foot-top{
            grid-template-columns:1fr;
        }

        .stackly-404-foot-stats{
            grid-template-columns:1fr 1fr;
            row-gap:20px;
        }

        .stackly-404-foot-stats div:nth-child(odd){
            border-left:0;
        }

        .stackly-404-foot-bottom{
            flex-direction:column;
            text-align:center;
        }

        .stackly-404-foot-news form{
            flex-direction:column;
            gap:10px;
        }

        .stackly-404-foot-news input,
        .stackly-404-foot-news .stackly-404-btn{
            border-radius:8px;
            padding:13px;
        }
    }

    /* ---------- UTILITIES ---------- */

    /* replaces the former inline style="" attributes */

    .stackly-404-img-failed{
        background:linear-gradient(135deg,#1b2a52,#e6b45033);
    }

</style>
</head>
<body>

    <!-- ============ LOADER ============ -->

    <div id="loader">

        <div class="stackly-404-loader-logo">

            <img
                src="./stackly.png"
                alt="Stackly"
            />

        </div>

        <div class="stackly-404-loader-bar">

            <i></i>

        </div>

        <span class="stackly-404-loader-num">0%</span>

    </div>

    <!-- ============ BACKGROUND ============ -->

    <div class="stackly-404-bg">

        <div class="stackly-404-grid"></div>

        <div class="stackly-404-ring"></div>

        <div class="stackly-404-blob stackly-404-blob-1"></div>

        <div class="stackly-404-blob stackly-404-blob-2"></div>

        <div class="stackly-404-blob stackly-404-blob-3"></div>

    </div>

    <main>

        <!-- ============ HERO ============ -->

        <section class="stackly-404-hero">

            <div class="stackly-404-wrap stackly-404-err-wrap">

                <span class="stackly-404-eyebrow">Error 404</span>

                <p
                    class="stackly-404-err-code"
                    aria-hidden="true"
                >404</p>

                <h1 data-split>Page <em>not found</em></h1>

                <p
                    class="stackly-404-err-text"
                    data-r
                >Sorry, the page you are looking for does not exist, has moved or the link is broken.</p>

                <div
                    class="stackly-404-err-actions"
                    data-r
                >

                    <button
                        class="stackly-404-btn stackly-404-btn-outline"
                        id="goBack"
                        type="button"
                    >Go Back</button>

                    <a
                        class="stackly-404-btn"
                        href="index.html"
                    >Return to Home</a>

                </div>

            </div>

        </section>

    </main>
 


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>
(function(){
  'use strict';

  var $ = function(s,c){return (c||document).querySelector(s)};
  var $$ = function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s))};
  var SESSION_KEY = 'stackly_tax_user';
  var hasGsap = !!(window.gsap && window.ScrollTrigger);
  var canHover = window.matchMedia('(hover:hover)').matches;

  /* ---------- Loader ---------- */
  var loader = $('#loader');
  if(loader){
    var bar = $('i', loader), num = $('.stackly-404-loader-num', loader), start = performance.now();
    if(hasGsap){ gsap.globalTimeline.pause(); }
    document.body.style.overflow = 'hidden';
    (function tick(now){
      var p = Math.min((now - start) / 1600, 1), e = 1 - Math.pow(1 - p, 3);
      bar.style.width = e * 100 + '%';
      num.textContent = Math.round(e * 100) + '%';
      if(p < 1){ requestAnimationFrame(tick); return; }
      loader.classList.add('stackly-404-is-done');
      document.body.style.overflow = '';
      setTimeout(function(){
        if(hasGsap){ gsap.globalTimeline.play(); ScrollTrigger.refresh(); }
      }, 450);
      setTimeout(function(){ loader.remove(); }, 1000);
    })(start);
  }

  /* ---------- Images: fallback when a photo fails to load ---------- */
  $$('img[loading="lazy"]').forEach(function(img){
    var fail = function(){ img.classList.add('stackly-404-img-failed'); img.removeAttribute('src'); };
    img.addEventListener('error', fail);
    if(img.complete && img.naturalWidth === 0 && img.getAttribute('src')){ fail(); }
  });

  /* ---------- Header: account button + mobile menu ---------- */
  var user = null;
  try{ user = JSON.parse(localStorage.getItem(SESSION_KEY)); }catch(err){ user = null; }
  var account = $('#accountBtn');
  if(user && account){
    account.textContent = 'Dashboard';
    account.setAttribute('href', user.role === 'admin' ? 'admin.html' : 'dashboard.html');
  }

  var burger = $('#burger'), nav = $('#mainNav');
  function setMenu(open){
    nav.classList.toggle('stackly-404-is-open', open);
    burger.classList.toggle('stackly-404-is-open', open);
    burger.innerHTML = open ? '&#10005;' : '&#9776;';
    burger.setAttribute('aria-expanded', open);
  }
  burger.addEventListener('click', function(){ setMenu(!nav.classList.contains('stackly-404-is-open')); });
  $$('a', nav).forEach(function(a){ a.addEventListener('click', function(){ setMenu(false); }); });
  window.addEventListener('resize', function(){ if(window.innerWidth > 768){ setMenu(false); } });

  /* ---------- FAQ: one answer open at a time ---------- */
  $$('.stackly-404-faq details').forEach(function(d){
    d.addEventListener('toggle', function(){
      if(!d.open){ return; }
      $$('.stackly-404-faq details').forEach(function(o){ if(o !== d){ o.open = false; } });
    });
  });

  /* ---------- Go back button (404 page) ---------- */
  var goBack = $('#goBack');
  if(goBack){
    goBack.addEventListener('click', function(){
      if(window.history.length > 1 && document.referrer){ window.history.back(); }
      else{ window.location.href = 'index.html'; }
    });
  }

  /* ---------- Forms ---------- */
  $$('form[data-alert]').forEach(function(f){
    f.addEventListener('submit', function(e){
      e.preventDefault();
      f.reset();
      alert(f.getAttribute('data-alert'));
    });
  });

  var newsForm = $('#newsForm');
  if(newsForm){
    newsForm.addEventListener('submit', function(e){
      e.preventDefault();
      $('button', newsForm).textContent = 'Subscribed \u2713';
      newsForm.reset();
    });
  }

  /* ---------- Animations ---------- */
  if(!hasGsap){ return; }
  gsap.registerPlugin(ScrollTrigger);

  // Animated background
  gsap.to('.stackly-404-grid', {backgroundPosition:'0 600px', duration:14, repeat:-1, ease:'none'});
  gsap.to('.stackly-404-ring', {rotation:360, duration:40, repeat:-1, ease:'none'});
  ['.stackly-404-blob-1', '.stackly-404-blob-2', '.stackly-404-blob-3'].forEach(function(sel, i){
    gsap.to(sel, {x:'random(-160,160)', y:'random(-120,120)', scale:'random(.8,1.3)', duration:7 + i * 2, repeat:-1, yoyo:true, ease:'sine.inOut'});
  });
  window.addEventListener('mousemove', function(e){
    var x = e.clientX / window.innerWidth - .5, y = e.clientY / window.innerHeight - .5;
    gsap.to('.stackly-404-blob-1', {xPercent:x * 40, yPercent:y * 40, duration:1.5});
    gsap.to('.stackly-404-blob-2', {xPercent:-x * 50, yPercent:-y * 50, duration:1.8});
  });

  // Split text: characters slide up out of masked words
  function splitText(el){
    (function walk(node){
      Array.prototype.slice.call(node.childNodes).forEach(function(c){
        if(c.nodeType !== 3){ walk(c); return; }
        var frag = document.createDocumentFragment();
        c.textContent.split(/(\s+)/).forEach(function(t){
          if(!t.trim()){ frag.append(t); return; }
          var w = document.createElement('span');
          w.className = 'stackly-404-word';
          Array.prototype.slice.call(t).forEach(function(ch){
            var s = document.createElement('span');
            s.className = 'stackly-404-char';
            s.textContent = ch;
            w.append(s);
          });
          frag.append(w);
        });
        c.replaceWith(frag);
      });
    })(el);
    gsap.from($$('.stackly-404-char', el), {yPercent:120, rotation:8, opacity:0, duration:1, stagger:.025, ease:'power4.out', scrollTrigger:{trigger:el, start:'top 90%'}});
  }
  $$('[data-split]').forEach(splitText);

  // Reveal on scroll
  $$('[data-r]').forEach(function(el){
    gsap.from(el, {y:60, opacity:0, duration:1, ease:'power3.out', scrollTrigger:{trigger:el, start:'top 88%'}});
  });

  // Card groups
  $$('.stackly-404-card-grid').forEach(function(group){
    gsap.from(group.children, {y:80, opacity:0, rotateX:-15, stagger:.15, duration:1, ease:'power3.out', scrollTrigger:{trigger:group, start:'top 85%'}});
  });

  // Image frames: wipe in, then drift with scroll
  $$('.stackly-404-img-wrap').forEach(function(wrap){
    var img = $('img', wrap);
    gsap.from(wrap, {clipPath:'inset(0 100% 0 0)', duration:1.4, ease:'power4.inOut', scrollTrigger:{trigger:wrap, start:'top 85%'}});
    gsap.to(img, {scale:1, yPercent:-8, ease:'none', scrollTrigger:{trigger:wrap, scrub:true}});
  });

  // Marquee
  $$('.stackly-404-marquee div').forEach(function(m){
    m.innerHTML += m.innerHTML;
    gsap.to(m, {xPercent:-50, duration:25, repeat:-1, ease:'none'});
  });

  // Counters
  $$('[data-count]').forEach(function(el){
    var o = {v:0}, target = +el.dataset.count;
    gsap.to(o, {v:target, duration:2.2, ease:'power2.out', scrollTrigger:{trigger:el, start:'top 90%'}, onUpdate:function(){
      el.textContent = Math.round(o.v).toLocaleString('en-IN') + (el.dataset.s || '');
    }});
  });

  // Hover effects: card tilt + magnetic buttons
  if(canHover){
    $$('.stackly-404-card').forEach(function(c){
      c.addEventListener('mousemove', function(e){
        var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
        gsap.to(c, {rotateY:x * 10, rotateX:-y * 10, transformPerspective:800, duration:.4});
      });
      c.addEventListener('mouseleave', function(){ gsap.to(c, {rotateX:0, rotateY:0, duration:.6}); });
    });
    $$('.stackly-404-btn').forEach(function(b){
      b.addEventListener('mousemove', function(e){
        var r = b.getBoundingClientRect();
        gsap.to(b, {x:(e.clientX - r.left - r.width / 2) * .25, y:(e.clientY - r.top - r.height / 2) * .25, duration:.3});
      });
      b.addEventListener('mouseleave', function(){ gsap.to(b, {x:0, y:0, duration:.6, ease:'elastic.out(1,.4)'}); });
    });
  }
})();

</script>

</body>
</html>
